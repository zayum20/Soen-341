<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=photo_camera" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="nav-bar.css">
        <link rel="stylesheet" href="profile.css">
    </head>
    <body class="nav-collapsed">
        <header class="top-header">
            <button id="hamburger" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <img class="header-logo" src="careerconnect-logo.png" alt="CareerConnect Logo">
        </header>

        <nav id="main-nav" class="navbar">
            <ul class="nav-links">
                <li>
                    <a href="Profile.html" class="active">
                        <i class="bi bi-person"></i>
                        <span>My Profile</span>
                    </a>
                </li>
                <!--
                <li>
                    <a href="Dashboard.html">
                        <i class="bi bi-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#" >
                        <i class="bi bi-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
    -->
                <li>
                    <a href="#" id="logout-link">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </li>
                
            </ul>
        </nav>
        <section>
            <span class="header">
                <p><b>My Profile</b></p>
                <a href="Edit_Profile.html" class="edit-btn">Edit Profile</a>
            </span>
            
            <p> Keep your profile up to date.</p>
            
        </section>
        <section>
            <div class="profile-panel">
                <div class="profile-card">
                    <div class="profile-info">
                        
                        <div class="profile-picture">
                            <img src="default.png" alt="Profile picture">
                            <label for="file-path">
                                <span class="material-symbols-rounded">
                                  photo_camera  
                                </span>
                            </label>
                            <input type="file" accept="image/jpeg, image/png, image/jpg" id="file-path">
                        </div>

                        <div class="profile-text">
                            <p>name</p>
                            <p>Career Type</p>
                        </div>
                        <div class="profile-details">
                            <p>
                                <i class="bi bi-envelope"></i>
                                email
                            </p>
                            <p>
                                <i class="bi bi-telephone"></i>
                                number
                            </p>
                            <p>
                                <i class="bi bi-geo-alt"></i>
                                location
                            </p>
                            <p>About Me</p>
                            <div class="skills-section">
                                <p class="skills-heading">Skills</p>
                                <div class="skills-list" id="profile-skills-list">
                                    <span class="skill-tag">JavaScript</span>
                                    <span class="skill-tag">Python</span>
                                    <span class="skill-tag">SQL</span>
                                    <span class="skill-tag">Git</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <script src="profile.js"></script>
    </body>
</html>

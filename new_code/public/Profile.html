                        <!-- 
                            ===================================================================
                            BACKEND INTEGRATION NOTES (Node.js + SQL) - PROFILE PICTURE:
                            ===================================================================
                            1. Node.js Route Needed:
                               - POST /api/profile/upload-avatar
                               - Handle multipart/form-data using the 'multer' package.
                               - Save the uploaded image to server folder (e.g., 'public/uploads/').

                            2. SQL Database Requirements:
                               - In 'users' table, store file path as VARCHAR:
                                 ALTER TABLE users ADD COLUMN profile_picture VARCHAR(255) DEFAULT 'images/default.png';
                               - SQL Update query:
                                 UPDATE users SET profile_picture = ? WHERE id = ?;

                            3. Frontend Upload Logic (in profile.js):
                               - When user selects a file below, JS sends FormData with field 'avatar':
                                 const formData = new FormData();
                                 formData.append('avatar', fileInput.files[0]);
                                 fetch('/api/profile/upload-avatar', { method: 'POST', body: formData });
                            ===================================================================
                        -->
                 <div class="profile-picture">
                            <img src="images/default.png" alt="Profile picture"
                             onerror="this.src='images/default.png'">
                            <button type="button" id="camera-btn" class="camera-btn">
                                <span class="material-symbols-rounded">
                                  photo_camera  
                                </span>
                            </button>
                            <input type="file" accept="image/jpeg, image/png, image/jpg, image/svg+xml" id="file-path" hidden>

                            <div id="avatar-menu" class="avatar-menu" hidden>
                                <button type="button" id="upload-photo-btn">Upload Photo</button>
                                <button type="button" id="delete-avatar-btn" class="delete-btn">Remove Photo</button>
                                
                            </div>
                        </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect</title>
    <link rel="icon" type="image/png" href="images/tab-logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="applications.css">
</head>
<body>
    <header class="site-header">
        <img class="header-logo" src="images/careerconnect-logo.png" alt="CareerConnect">
        <nav class="site-nav" aria-label="Account">
            <a id="account-link" href="login.html">Log In</a>
            <a id="register-link" href="register.html">Create an Account</a>
        </nav>
    </header>

  
<main class="job-board">

    <!-- Welcome section displayed to all visitors -->
    <section class="home-hero">

        <!-- Main heading of the homepage -->
        <h1>Your career starts here.</h1>

        <!-- Short description of CareerConnect -->
        <p class="intro">
            Connect with employers, discover opportunities,
            and take the next step in your career.
        </p>

    </section>

    <!-- Heading for the existing job search section -->
    <h2>Explore Job Opportunities</h2>

        <form id="search-form" class="search-form">
            <label class="visually-hidden" for="search-input">Search jobs</label>
            <input id="search-input" type="search" placeholder="Search by title, company, or location">
            <button type="submit">Search</button>
        </form>
        <div id="jobs-list" class="job-list"></div>
        <p id="jobs-message" class="board-message" hidden></p>
    </main>

    <script src="applications-common.js"></script>
    <script src="index.js"></script>
</body>
</html>

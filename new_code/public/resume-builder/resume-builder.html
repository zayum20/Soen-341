<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Resume Builder</title>
<link rel="icon" type="image/png" href="../images/tab-logo.png">
<link rel="stylesheet" href="resume-builder.css"><link rel="stylesheet" href="templates.css"></head>
<body>
<div id="app">
  <div id="topbar">
    <a class="back-link" href="../Profile.html" aria-label="Back to profile" title="Back to profile">←</a>
    <img class="header-logo" src="../../images/careerconnect-logo.png" alt="CareerConnect Logo">
    <span class="spacer"></span>
    <input type="file" id="file" accept=".pdf,.docx" hidden>
    <button id="upload">Upload resume</button><button id="save">Save</button><button id="download" class="primary">Download PDF</button></div>
  <div id="layout">
    <aside id="left"><div id="sections"></div></aside>
    <section id="mid"><div id="zoom"><button id="zo">-</button><button id="zi">+</button></div><div id="scroll"><div id="page"></div></div></section>
    <aside id="right"><div id="gallery"></div></aside>
  </div>
</div>
<div id="modal" hidden><div class="box"><div class="mbar"><b id="mtitle"></b><span class="spacer"></span>
  <button id="muse" class="primary">Use this template</button><button id="mclose">Close</button></div><div id="mbody"></div></div></div>
<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="templates.js"></script><script src="resume-builder.js"></script>
</body></html>

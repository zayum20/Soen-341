        <section>
            <span class="header">
                <p><b>Post a New Job Opportunity</b></p>
                <div id="message-container"></div> <!--for Javascript to display messages to the user. -->
            </span>
            
    <form id="create-job-form">

  <!-- Job Title -->
  <div>
    <label for="jobTitle">Job Title:</label>
    <input type="text" id="jobTitle" name="jobTitle" placeholder="Software Engineer" required>
  </div>

  <!-- Company Name -->
  <div>
    <label for="companyName">Company Name:</label>
    <input type="text" id="companyName" name="companyName" placeholder="Your Company" required>
  </div>
<!-- Location -->
  <div>
    <label for="location">Location:</label>
    <input type="text" id="location" name="location" placeholder="City, State" required>
  </div>
<!-- Category -->
  <div>
    <label for="category">Category:</label>
<select name="category" id="category">
  <option value="">--Please choose a category--</option>
  <option value="Technology">Technology</option>
  <option value="Marketing">Marketing</option>
  <option value="Healthcare">Healthcare</option>
  <option value="Finance">Finance</option>
</select>
   
  </div>

  <!-- Job Type -->
  <div>
    <label for="jobType">Job Type:</label>
<select name="jobType" id="jobType">
  <option value="">--Please choose a job type--</option>
  <option value="Full-time">Full-Time</option>
  <option value="Part-time">Part-Time</option>
  <option value="Contract">Contract</option>
  <option value="Internship">Internship</option>
</select>
   
  </div>

  <!-- Description -->
  <div>
    <label for="description">Description:</label>
    <textarea id="description" name="description" rows="4" cols="50" placeholder="Type here..."required></textarea>
  </div>
<!-- Submit button -->
  <button type="submit">Submit Form</button>
        </form>
        </section>
   
        <script src="Employer_Dashboard.js"></script>

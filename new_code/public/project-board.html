<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project Board — CareerConnect</title>
        <link rel="icon" type="image/png" href="images/tab-logo.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="nav-bar.css">
        <link rel="stylesheet" href="profile.css">
        <link rel="stylesheet" href="applications.css">
        <link rel="stylesheet" href="project-board.css">
    </head>
    <body class="nav-collapsed">
        <header class="top-header">
            <button id="hamburger" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <img class="header-logo" src="images/careerconnect-logo.png" alt="CareerConnect Logo">
        </header>

        <nav id="main-nav" class="navbar">
            <ul class="nav-links">
                <li>
                    <a href="Profile.html">
                        <i class="bi bi-person"></i>
                        <span>My Profile</span>
                    </a>
                </li>
                <li>
                    <a href="jobs.html">
                        <i class="bi bi-briefcase"></i>
                        <span>Jobs</span>
                    </a>
                </li>
                <li>
                    <a href="my-applications.html">
                        <i class="bi bi-clipboard-check"></i>
                        <span>My Applications</span>
                    </a>
                </li>
                <li>
                    <a href="project-board.html" class="active">
                        <i class="bi bi-kanban"></i>
                        <span>Project Board</span>
                    </a>
                </li>
                <li>
                    <a href="Dashboard.html">
                        <i class="bi bi-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li>
                    <a href="#" id="logout-link">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <section class="board-page">
            <span class="header">
                <p><b>Project Board</b></p>
            </span>
            <p class="board-intro">
                Sprint workflow for CareerConnect work items:
                <strong>Backlog</strong> → <strong>Ready</strong> → <strong>In Progress</strong>
                (matching the team process).
            </p>

            <div class="project-board" role="list" aria-label="Project board columns">
                <section class="board-column" data-status="Backlog" aria-labelledby="col-backlog">
                    <header class="column-header">
                        <h2 id="col-backlog">Backlog</h2>
                        <span class="column-count" id="count-backlog">0</span>
                    </header>
                    <div class="column-cards" id="cards-backlog"></div>
                </section>

                <section class="board-column" data-status="Ready" aria-labelledby="col-ready">
                    <header class="column-header">
                        <h2 id="col-ready">Ready</h2>
                        <span class="column-count" id="count-ready">0</span>
                    </header>
                    <div class="column-cards" id="cards-ready"></div>
                </section>

                <section class="board-column" data-status="In Progress" aria-labelledby="col-in-progress">
                    <header class="column-header">
                        <h2 id="col-in-progress">In Progress</h2>
                        <span class="column-count" id="count-in-progress">0</span>
                    </header>
                    <div class="column-cards" id="cards-in-progress"></div>
                </section>
            </div>

            <p id="board-message" class="page-message" hidden></p>
        </section>

        <script src="applications-common.js"></script>
        <script src="project-board.js"></script>
    </body>
</html>

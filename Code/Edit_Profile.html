<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Profile</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="Edit_Profile.css">
    </head>
    <body>
        <div class="page-container">

            <main class="edit-card">
                <div class="card-header">
                    <h1>Edit Profile</h1>
                </div>

                <form class="edit-form">
                    <div class="grid">
                        <div class="field">
                            <label for="firstName">First Name <span class="required">*</span></label>
                            <input type="text" id="firstName" name="firstName" value="Ariane">
                        </div>
                        <div class="field">
                            <label for="lastName">Last Name <span class="required">*</span></label>
                            <input type="text" id="lastName" name="lastName" value="Madjofo">
                        </div>

                        <div class="field">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" name="email" value="ariane.madjofo@email.com">
                        </div>
                        <div class="field">
                            <label for="number">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="number" name="number" value="(514) 123-4567">
                        </div>

                        <div class="field">
                            <label for="location">Location <span class="required">*</span></label>
                            <input type="text" id="location" name="location" value="Pincourt, QC">
                        </div>
                        <div class="field">
                            <label for="status">Career Type <span class="required">*</span></label>
                            <select id="status" name="status">
                                <option>Job Seeker</option>
                                <option>Employer</option>
                            </select>
                        </div>

                        <div class="field full">
                            <label for="about">About Me <span class="required">*</span></label>
                            <textarea id="about" name="about">I'm a software engineering student with a passion for technology and problem solving. I'm looking for opportunities to gain experience and build my career in the tech industry.</textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="Profile.html" class="btn cancel">Cancel</a>
                        <button type="submit" class="btn save"><i class="bi bi-save"></i> Save Changes</button>
                    </div>
                </form>
            </main>
        </div>
    </body>
</html>
